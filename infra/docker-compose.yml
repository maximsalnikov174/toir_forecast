name: service_forecast

services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - toir_app_data:/var/lib/postgresql/data/pgdata
    command: >
      postgres -c max_connections=1000
               -c shared_buffers=256MB
               -c effective_cache_size=768MB
               -c maintenance_work_mem=64MB
               -c checkpoint_completion_target=0.7
               -c wal_buffers=16MB
               -c default_statistics_target=100
               -c timezone=UTC
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [internal]

  migrations:
    build:
      context: ../src/toir_app/
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["alembic", "upgrade", "head"]
    networks: [internal]

  backend:
    build:
      context: ../src/toir_app/
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:8877"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  frontend:
    build:
      context: ../src/frontend/
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_started
    networks: [internal]

  nginx:
    image: nginx:1.27
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8811:80"
    depends_on:
      - backend
    networks: [internal]

volumes:
  toir_app_data:
  migrations:

networks:
  internal:
    driver: bridge
